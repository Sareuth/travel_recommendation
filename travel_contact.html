<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dream Destinations</title>
    <link rel="stylesheet" href="./travel.css" />
  </head>
  <body>
    <nav>
      <div class="nav-left">
        <img src="./images/logo.png" alt="logo" class="logo" />
        <h1>Dream Destinations</h1>
      </div>

      <ul class="nav-links">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./travel_about.html">About Us</a></li>
        <li><a href="./travel_contact.html">Contact Us</a></li>
      </ul>
    </nav>
    <div id="main">
      <div class="social-links">
        <a href="#" aria-label="X">
          <img src="./images/social/x.svg" alt="X icon" />
        </a>
        <a href="#" aria-label="Facebook">
          <img src="./images/social/facebook.svg" alt="Facebook icon" />
        </a>
        <a href="#" aria-label="Instagram">
          <img src="./images/social/instagram.svg" alt="Instagram icon" />
        </a>
        <a href="#" aria-label="YouTube">
          <img src="./images/social/youtube.svg" alt="YouTube icon" />
        </a>
      </div>

      <div class="contact-container">
        <h2>Contact Us</h2>

        <form id="contactForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <button type="submit" onclick="thankyou()">Submit</button>
        </form>
      </div>
    </div>
    <script>
      function thankyou() {
        alert("Thank you for contacting us!");
      }
    </script>
  </body>
</html>
